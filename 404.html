<!DOCTYPE html>
<html lang="en" class="no-js">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />

  <!-- Content Security Policy. GitHub Pages cannot set response headers, so this
     goes in a meta tag; frame-ancestors is deliberately absent because it is
     ignored there and only logs a console warning. script-src has no
     'unsafe-inline': the only inline handler this page had was the font
     stylesheet's onload, which went away with self-hosting. style-src still
     needs it for the style="" attributes in the markup. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; form-action 'self'" />

  <title>Page not found - Suresh Reddy</title>
  <meta name="description" content="That page does not exist. Head back to the portfolio, developer tools or games." />

  <!-- Keep 404s out of the index -->
  <meta name="robots" content="noindex, follow" />

  <!-- Favicons -->
  <link href="assets/img/favicon.png" rel="icon" />
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0563bb" />

  <!-- Self-hosted fonts. Only the 8 variants actually rendered anywhere on the
     site (measured, not guessed): Open Sans 400/700/400i, Poppins 400/600,
     Raleway 500/600/700. Open Sans and Raleway are variable, so one file each
     covers their whole weight range -- see assets/css/fonts.css.

     Serving these from this origin removes a third-party DNS lookup, TLS
     handshake and two round trips from every cold load, lets the service worker
     cache them, and stops handing each visitor's IP to Google. The two faces
     that paint headings and body copy are preloaded; the rest are pulled in on
     demand by unicode-range. -->
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/raleway-normal-500-700-latin.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/opensans-normal-400-700-latin.woff2" crossorigin />
  <link rel="stylesheet" href="assets/css/fonts.css" />

  <!-- Clears .no-js before paint and reveals the content if the page
     never finishes initialising. Must stay synchronous. -->
  <script src="assets/js/boot.js"></script>
